[package]
name = "gw-client"
version = "0.4.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# enables embedding the built frontend (dist/) instead of loading devUrl
default = []
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "gw-client"
path = "src/main.rs"
