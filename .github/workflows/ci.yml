# 仓库门禁（见 docs/DECISIONS.md D09 的 2026-10-17 翻案说明）。
#
# 只跑「本机与云端等价」的两类门禁：
#   1. Agent Note 三线校验（目录/格式/归档封印）——纯文本校验，不需要 GUI 与真实上游。
#   2. cargo test --release —— 主门禁，假上游走 127.0.0.1 真 socket，不依赖外网。
# ★ 真机验收（真实 gw-server.exe + 真实 Tauri 客户端 + 真实数据面请求）仍在 Windows 本机跑，
#   云端 CI 跑不出同等证据，不许拿本工作流冒充它。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-notes:
    name: Agent notes gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 归档封印要与「变更前」的 manifest 对比，浅克隆拿不到基线。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Node 24 原生剥离 TS 类型，脚本无需安装任何依赖（仓库无根 package.json）。
      # 三个脚本各自非零退出即整步失败；不要用 `|| true` 或 `;` 串联。
      - name: Verify note tree
        run: node .agents/skills/agent-notes/scripts/verify-agent-note-tree.ts

      - name: Verify note format
        run: node .agents/skills/agent-notes/scripts/verify-agent-note-format.ts

      - name: Verify archive seals
        env:
          # 默认 HEAD 在干净检出上等于「与自身对比」，查不出 append-only 违规。
          # PR 用 base sha；push 用上一个 tip（新分支推送为全 0，脚本会跳过该段）。
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .agents/skills/agent-notes/scripts/verify-archived-agent-notes.ts

      # 元门禁：对上面三条脚本逐条做故障注入，证明它们真的会变红。
      # 一条恒 exit 0 的校验与一条真的校验，在「跑绿了」上长得一模一样；
      # 没有这一步，上面三步全绿也可能什么也没验证。
      - name: Prove the note gates can actually fail
        run: node tools/verify-notes-gates.mjs

  server-tests:
    name: Server tests (cargo test --release)
    runs-on: windows-latest
    defaults:
      run:
        # 仓库根没有 Cargo.toml；cargo 必须在 server/ 下跑。
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # --locked：Cargo.lock 与 Cargo.toml 不一致时直接失败，而不是在 CI 里静默改依赖版本。
      - name: cargo test --release
        run: cargo test --release --locked

  # 客户端必须能在三个平台各自编译通过。
  #
  # 为什么需要：main.rs 里有大量 `#[cfg(windows)] / #[cfg(not(windows))]` 分支，
  # 只在 Windows 上编译等于另一边的代码从来没被编译器看过一眼——那种错误只有到
  # 发版那天才会暴露，而那时已经打了标签。这里每次都过一遍编译器。
  #
  # 只做 cargo check（不打包、不发版）：真正的安装包由 release.yml 产出。
  # 但 check 也要真实：`tauri-build` 会在构建脚本里校验 externalBin 指向的文件是否存在，
  # 所以必须先真的编出 server 并放到 Tauri 约定的名字上，否则这一步会直接失败
  # （已实测：抽掉 sidecar 后 check 报 `resource path ... doesn't exist`）。用 debug 构建
  # 即可，产物不发布，只要文件真实存在且能编过。
  client-check:
    name: Client check (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
          - label: macos
            os: macos-latest
            triple: aarch64-apple-darwin
          - label: linux
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 固定 10：client/package.json 的 `pnpm.onlyBuiltDependencies` 只有 pnpm 10 读。
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Linux system deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev \
            build-essential curl wget file

      - name: Cache cargo (server)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: server-${{ matrix.triple }}

      - name: Cache cargo (client)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: client-${{ matrix.triple }}

      - name: Build server for staging
        working-directory: server
        run: cargo build --locked --target ${{ matrix.triple }}

      - name: Stage sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/src-tauri/binaries
          # Tauri 在 Windows 上要求的文件名带 .exe，其它平台不带；名字对不上就直接
          # 报 `resource path ... doesn't exist`，不会静默降级。
          if [ "${{ matrix.label }}" = "windows" ]; then
            SRC="server/target/${{ matrix.triple }}/debug/gw-server.exe"
            DEST="client/src-tauri/binaries/gw-server-${{ matrix.triple }}.exe"
          else
            SRC="server/target/${{ matrix.triple }}/debug/gw-server"
            DEST="client/src-tauri/binaries/gw-server-${{ matrix.triple }}"
          fi
          cp "$SRC" "$DEST"
          ls -l client/src-tauri/binaries/

      - name: Build frontend
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # generate_context! / tauri-build 会读 tauri.conf.json 与图标文件，
      # 所以这一步同时覆盖「配置写坏了」「图标缺了」这类错误。
      - name: cargo check
        working-directory: client/src-tauri
        run: cargo check --locked --target ${{ matrix.triple }}
