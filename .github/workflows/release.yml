# 跨平台发布流水线：Windows 10/11 · macOS（Intel + Apple Silicon 合并为 universal）· Linux
#
# 触发：推送 v* 标签，或手动 workflow_dispatch（手动时必须给 tag 输入）。
#
# 设计约束（对应 docs/DECISIONS.md 的相关条目）：
#   * 每个平台都在**该平台的原生 runner** 上构建本地二进制，不做交叉编译——Tauri 的
#     Linux 依赖（webkit2gtk）与 macOS 的签名/打包工具链都要求原生环境。
#   * sidecar 由流水线**现编**，不复用仓库里入库的那份 Windows 二进制：那份只服务于
#     本机开发，若复用会让 macOS/Linux 包里塞进一个 Windows exe。
#   * 每个产物都要跑一遍 tools/smoke-server.mjs：真的启动、真的连 /healthz、真的断言
#     body == "ok"。只有「文件存在 + 体积非 0」不算产物可用。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签（例如 v0.5.0），必须与 tauri.conf.json 的 version 一致'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 先把「标签与版本号是否对得上」这道闸卡在最前面：
  # 一个 v0.5.1 的标签配上 0.5.0 的产物，装到用户机器上会显示错误的版本，
  # 而且这种错配在发布页面上看不出来。
  verify-version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Read and compare versions
        id: read
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CONF_VERSION=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          SERVER_VERSION=$(grep -m1 '^version' server/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          CLIENT_VERSION=$(grep -m1 '^version' client/src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG conf=$CONF_VERSION server=$SERVER_VERSION client=$CLIENT_VERSION"
          [ "$TAG" = "v$CONF_VERSION" ] || { echo "::error::标签 $TAG 与 tauri.conf.json 的 $CONF_VERSION 不一致"; exit 1; }
          [ "$CONF_VERSION" = "$SERVER_VERSION" ] || { echo "::error::server/Cargo.toml 版本 $SERVER_VERSION 与 conf 的 $CONF_VERSION 不一致"; exit 1; }
          [ "$CONF_VERSION" = "$CLIENT_VERSION" ] || { echo "::error::client Cargo.toml 版本 $CLIENT_VERSION 与 conf 的 $CONF_VERSION 不一致"; exit 1; }
          echo "version=$CONF_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar: gw-server-x86_64-pc-windows-msvc.exe
            expect: 2   # nsis 安装包 + gw-server.exe
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            sidecar: gw-server-universal-apple-darwin
            expect: 2   # dmg + gw-server
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar: gw-server-x86_64-unknown-linux-gnu
            expect: 3   # deb + AppImage + gw-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 工具链 ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 固定 10 而不是 latest：client/package.json 的 `pnpm.onlyBuiltDependencies`
          # 只有 pnpm 10 读，pnpm 11 会忽略它并改从别处读白名单。切到 11 会让
          # esbuild / @tauri-apps/cli 的安装脚本被拦，打包在更难定位的地方失败。
          # lockfileVersion 是 9.0，pnpm 10 能直接吃。
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.target == 'universal-apple-darwin'
                && 'aarch64-apple-darwin,x86_64-apple-darwin'
                || matrix.target }}

      - name: Cache cargo (server)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: server-${{ matrix.target }}

      - name: Cache cargo (client)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: client-${{ matrix.target }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev \
            build-essential curl wget file

      # ---------- sidecar：现编，不拿入库的那份 ----------
      - name: Build sidecar (single target)
        if: matrix.target != 'universal-apple-darwin'
        working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }}

      # universal 的 sidecar 必须自己也是 universal，否则 .app 里一半架构的
      # 用户会在启动网关时拿到 "bad CPU type"。
      - name: Build sidecar (universal macOS)
        if: matrix.target == 'universal-apple-darwin'
        working-directory: server
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p ../client/src-tauri/binaries
          lipo -create \
            target/aarch64-apple-darwin/release/gw-server \
            target/x86_64-apple-darwin/release/gw-server \
            -output ../client/src-tauri/binaries/gw-server-universal-apple-darwin
          lipo -info ../client/src-tauri/binaries/gw-server-universal-apple-darwin

      - name: Stage sidecar next to the client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/src-tauri/binaries
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            SRC="server/target/${{ matrix.target }}/release/gw-server.exe"
          else
            SRC="server/target/${{ matrix.target }}/release/gw-server"
          fi
          # universal 的 sidecar 已由上一步 lipo 生成，这里不覆盖它。
          if [ "${{ matrix.target }}" != "universal-apple-darwin" ]; then
            cp "$SRC" "client/src-tauri/binaries/${{ matrix.sidecar }}"
          fi
          ls -l client/src-tauri/binaries/

      # 产物可用性的第一道真实检查：这个二进制自己能不能跑起来并答复 /healthz。
      # 放在打包之前，坏二进制就不用浪费后面十几分钟的 bundling。
      - name: Smoke-test the sidecar binary
        run: node tools/smoke-server.mjs "client/src-tauri/binaries/${{ matrix.sidecar }}"

      # ---------- 打包 ----------
      - name: Install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build installers
        working-directory: client
        run: pnpm tauri build --target ${{ matrix.target }}

      # ---------- 收集产物 ----------
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          shopt -s nullglob
          # Tauri 把产物放在 target/<triple>/release/bundle/<kind>/
          for f in client/src-tauri/target/${{ matrix.target }}/release/bundle/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.deb|*.AppImage|*.dmg|*.exe|*.msi) cp -v "$f" dist-out/ ;;
            esac
          done
          # 同时把裸 server 二进制发出去，方便只想跑网关不要桌面端的用户。
          cp -v "client/src-tauri/binaries/${{ matrix.sidecar }}" dist-out/
          ls -l dist-out/

      # 打包产物不能是空的或明显残缺：一个 0 字节的 .dmg 也会被当成「构建成功」。
      # 数量与体积都按平台的**已知正确值**核对，而不是「大于 0 就算过」。
      - name: Assert artifacts are real
        shell: bash
        run: |
          set -euo pipefail
          MIN_BYTES=1000000   # 1MB；三个平台的安装包都远超这个数
          COUNT=0
          for f in dist-out/*; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$(basename "$f") = $SIZE bytes"
            [ "$SIZE" -ge "$MIN_BYTES" ] || { echo "::error::$(basename "$f") 只有 $SIZE 字节，产物不完整"; exit 1; }
            COUNT=$((COUNT+1))
          done
          echo "共 $COUNT 个产物，期望 ${{ matrix.expect }} 个"
          [ "$COUNT" -eq ${{ matrix.expect }} ] || { echo "::error::产物数量 $COUNT 与期望的 ${{ matrix.expect }} 不符——少了说明某个打包目标没产出，多了说明收集到了不该发的东西"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist-out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release payload
        run: ls -lR artifacts

      # README 承诺发布 SHA256SUMS.txt，就必须真的产出它；否则用户按文档去校验会找不到文件。
      # 先算校验和再写进同一个目录，避免把 SUM 文件自己算进去。
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS.txt
          for f in *; do
            [ "$f" = "SHA256SUMS.txt" ] && continue
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
          # 空清单说明上面一个产物都没收到，绝不能给用户一个「校验通过」的空文件。
          [ -s SHA256SUMS.txt ] || { echo "::error::SHA256SUMS.txt 为空，产物目录里没有文件"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-version.outputs.tag }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="release-notes.md"
          {
            echo "## AI 网关 v${VERSION}"
            echo
            echo "### 平台支持"
            echo
            echo "| 平台 | 安装包 |"
            echo "|---|---|"
            echo "| Windows 10 / 11 (x64) | \`gw-client_${VERSION}_x64-setup.exe\` |"
            echo "| macOS 11+ (Intel + Apple Silicon，universal) | \`gw-client_${VERSION}_universal.dmg\` |"
            echo "| Linux x64 | \`gw-client_${VERSION}_amd64.deb\` / \`gw-client_${VERSION}_amd64.AppImage\` |"
            echo
            echo "每个平台另附独立的 \`gw-server-*\` 二进制，供只跑网关、不需要桌面控制台的场景。"
            echo
            echo "### 安装说明（重要，未做代码签名）"
            echo
            echo "- **Windows**：安装包未签名，SmartScreen 会提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。"
            echo "- **macOS**：未做 Apple 公证，首次打开会提示「无法验证开发者」。在 Finder 里右键点应用 → 打开 → 再点「打开」；"
            echo "  或者执行 \`xattr -dr com.apple.quarantine /Applications/gw-client.app\`。"
            echo "- **Linux**：\`.deb\` 用 \`sudo dpkg -i\` 安装；\`.AppImage\` 需先 \`chmod +x\`。"
            echo
            echo "### 数据目录"
            echo
            echo "- Windows：程序所在目录（与旧版一致，升级不会搬动已有数据库）"
            echo "- macOS：\`~/Library/Application Support/com.gawaty.client/\`"
            echo "- Linux：\`~/.local/share/com.gawaty.client/\`"
          } > "$NOTES"
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file "$NOTES" \
            --verify-tag
